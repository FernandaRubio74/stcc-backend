<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src &#39;none&#39;; style-src &#39;unsafe-inline&#39;; img-src data:; base-uri &#39;none&#39;; form-action &#39;none&#39;">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Paquetes pendientes · Courier Express</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: #1a1d23;
  background: #f1f3f7;
  -webkit-font-smoothing: antialiased;
}
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }

/* Encabezado */
.topbar {
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 8px 24px;
  background: #ffffff;
  border-bottom: 1px solid #e3e6ec;
  position: sticky; top: 0; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: #276749; color: #ffffff;
  display: inline-flex; align-items: center; justify-content: center; flex: none; }
.brand-name { font-size: 14px; letter-spacing: -0.01em; }
.user-menu { display: flex; align-items: center; gap: 8px; }
.user-role { font-size: 12px; color: #5a616e; background: #f7f8fa;
  border: 1px solid #e3e6ec; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.avatar { width: 32px; height: 32px; border-radius: 999px; background: #e8f5ee; color: #1d4f37;
  display: inline-flex; align-items: center; justify-content: center; font-size: 12px;
  font-weight: 500; flex: none; }

/* Navegacion */
.sidenav {
  background: #ffffff;
  border-right: 1px solid #e3e6ec; padding: 16px 8px; display: flex;
       flex-direction: column; gap: 2px;
}
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 8px; font-size: 13px; border-radius: 8px;
  color: #5a616e; text-decoration: none; font-weight: 500;
}
.nav-item.is-active { color: #1d4f37; background: #e8f5ee; }
.nav-item.is-active .nav-icon { color: #276749; }
.nav-icon { display: inline-flex; flex: none; }
.nav-group-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
  color: #848b99; padding: 8px 8px 4px; }

/* Contenido */
.main { padding: 24px; padding-bottom: 32px;
  max-width: 100%; overflow-x: hidden; }
.breadcrumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
  font-size: 12px; color: #5a616e; margin-bottom: 8px; }
.breadcrumbs .sep { color: #848b99; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  flex-wrap: wrap; margin-bottom: 24px; }
.page-title { font-size: 24px; font-weight: 600;
  letter-spacing: -0.02em; margin: 0; }
.page-subtitle { margin: 4px 0 0; color: #5a616e; font-size: 14px; max-width: 62ch; }
.page-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 24px; }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  font-family: inherit; font-size: 13px; font-weight: 500;
  border-radius: 8px; padding: 9px 14px;
   border: 1px solid transparent; cursor: default; text-decoration: none;
  white-space: nowrap; }
.btn-primary { background: #276749; color: #ffffff; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05); }
.btn-secondary { background: #ffffff; color: #1a1d23; border-color: #cfd4de;
  box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05); }
.btn-ghost { background: transparent; color: #1d4f37; }
.btn-danger { background: #fdecee; color: #a3202a; border-color: #a3202a33; }

/* Tarjeta / panel */
.card { background: #ffffff; border: 1px solid #e3e6ec; border-radius: 12px;
  box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05); overflow: hidden; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 16px; border-bottom: 1px solid #e3e6ec; }
.card-title { font-size: 18px; font-weight: 600; margin: 0; }
.card-body { padding: 16px; }
.card-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

/* Resumenes numericos */
.stats { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.stat { background: #ffffff; border: 1px solid #e3e6ec; border-radius: 12px;
  padding: 16px; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05); }
.stat-label { font-size: 12px; color: #5a616e; margin: 0 0 4px; }
.stat-value { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.stat-delta { font-size: 12px; margin-top: 2px; }

/* Barra de herramientas de tabla */
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 16px;
  border-bottom: 1px solid #e3e6ec; }
.search { display: flex; align-items: center; gap: 4px; flex: 1 1 200px; min-width: 0;
  border: 1px solid #cfd4de; border-radius: 8px; padding: 8px 8px;
  color: #848b99; background: #ffffff;  }
.search-text { font-size: 13px; }
.chip { font-size: 12px; color: #5a616e; background: #f7f8fa;
  border: 1px solid #e3e6ec; border-radius: 999px; padding: 4px 10px;
   }

/* Tabla (escritorio) / fichas (movil) */
.table-wrap { width: 100%; overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th { text-align: left; font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.04em; color: #5a616e; font-weight: 500;
  padding: 8px 16px; background: #f7f8fa; border-bottom: 1px solid #e3e6ec;
  white-space: nowrap; }
table.data td { padding: 8px 16px; border-bottom: 1px solid #e3e6ec; vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data .num { text-align: right; font-variant-numeric: tabular-nums; }

.pagination { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 16px; border-top: 1px solid #e3e6ec;
  font-size: 12px; color: #5a616e; }
.pager { display: flex; gap: 4px; }
.pager span { border: 1px solid #e3e6ec; border-radius: 6px; padding: 2px 8px;
  background: #ffffff; }
.pager span.is-active { background: #e8f5ee; color: #1d4f37; border-color: #27674933; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px;
  font-weight: 500; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.badge-neutral { background: #f7f8fa; color: #5a616e; border: 1px solid #e3e6ec; }
.badge-success { background: #e7f6ee; color: #1b6b45; }
.badge-warning { background: #fdf3e2; color: #8a5200; }
.badge-danger { background: #fdecee; color: #a3202a; }
.badge-info { background: #eaf1fb; color: #1f4f8f; }

/* Formularios */
.form-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field-label { font-size: 13px; font-weight: 500; color: #1a1d23; }
.field-required { color: #a3202a; }
.input { border: 1px solid #cfd4de; border-radius: 8px; background: #ffffff;
  padding: 9px 8px; font-size: 14px; color: #1a1d23;
   display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.input.is-placeholder { color: #848b99; }
.input.is-error { border-color: #a3202a; }
.input-area { min-height: 76px; align-items: flex-start; }
.field-help { font-size: 12px; color: #5a616e; }
.field-error { font-size: 12px; color: #a3202a; }
.checkbox-row { display: flex; align-items: center; gap: 8px; }
.checkbox { width: 18px; height: 18px; border: 1px solid #cfd4de; border-radius: 6px;
  background: #ffffff; flex: none; display: inline-flex; align-items: center; justify-content: center;
  color: #276749; }
.form-foot { display: flex; justify-content: flex-end; gap: 8px; padding-top: 16px;
  border-top: 1px solid #e3e6ec; margin-top: 16px; }

/* Listas y detalle */
.rows { display: flex; flex-direction: column; }
.row-item { display: flex; align-items: center; gap: 16px; padding: 16px;
  border-bottom: 1px solid #e3e6ec; }
.row-item:last-child { border-bottom: 0; }
.row-main { min-width: 0; flex: 1; }
.row-primary { font-weight: 500; }
.row-secondary { font-size: 12px; color: #5a616e; }
.row-meta { font-size: 12px; color: #848b99; font-variant-numeric: tabular-nums;
  white-space: nowrap; }
dl.detail { display: grid; grid-template-columns: minmax(140px, 220px) 1fr;
  gap: 8px 16px; margin: 0; }
dl.detail dt { font-size: 12px; color: #5a616e; }
dl.detail dd { margin: 0; }

/* Pestanas */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid #e3e6ec; overflow-x: auto; }
.tab { font-size: 13px; font-weight: 500; color: #5a616e;
  padding: 8px 16px; border-bottom: 2px solid transparent; white-space: nowrap;
   }
.tab.is-active { color: #1d4f37; border-bottom-color: #276749; }

/* Estados */
.state-banner { display: flex; align-items: flex-start; gap: 8px; border-radius: 12px;
  padding: 16px; font-size: 14px; }
.state-banner.is-error { background: #fdecee; color: #a3202a; }
.state-banner.is-success { background: #e7f6ee; color: #1b6b45; }
.state-title { font-weight: 500; }
.empty { text-align: center; padding: 48px 16px; color: #5a616e; }
.empty-mark { width: 44px; height: 44px; border-radius: 999px; background: #f7f8fa;
  color: #848b99; display: inline-flex; align-items: center; justify-content: center;
  margin-bottom: 8px; }
.empty-title { font-size: 18px; font-weight: 600; color: #1a1d23;
  margin: 0 0 4px; }
.skeleton { background: #f1f3f7; border-radius: 6px; height: 12px; }
.skeleton.is-wide { width: 100%; }
.skeleton.is-half { width: 50%; }
.skeleton.is-short { width: 28%; }
.skeleton-rows { display: flex; flex-direction: column; gap: 16px; }
.skeleton-row { display: flex; gap: 16px; align-items: center; }
.skeleton-chip { width: 32px; height: 32px; border-radius: 999px; background: #f1f3f7; flex: none; }

/* Anotaciones */
.ann { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px;
  border-radius: 999px; background: #276749; color: #ffffff;
  font-size: 11px; font-weight: 600; margin-left: 4px; padding: 0 5px; vertical-align: middle; }
.ann-list { margin-top: 24px; }
.ann-list ol { margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 8px; }
.ann-list li { font-size: 12px; color: #5a616e; }
.ann-ref { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; color: #1d4f37;
  background: #e8f5ee; border-radius: 6px; padding: 1px 5px; margin-left: 4px; }
</style>
</head>
<body>
<div class="app"><header class="topbar"><div class="brand"><span class="brand-mark">C</span><span class="brand-name">Courier Express</span></div><div class="user-menu"><span class="user-role">Revisador</span><span class="avatar">R</span><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg></span></div></header><nav class="sidenav" aria-label="Navegación principal"><span class="nav-group-label">Secciones</span><span class="nav-item"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></span><span>Panel</span></span><span class="nav-item is-active" aria-current="page"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3l8 4v10l-8 4-8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg></span><span>Paquetes</span></span><span class="nav-item"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span>Historial</span></span><span class="nav-item"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.6 12.6L12 21.2 2.8 12V2.8H12z"/><circle cx="7.3" cy="7.3" r="1.3"/></svg></span><span>Etiquetas</span></span></nav><main class="main"><nav class="breadcrumbs" aria-label="Ruta"><span>Inicio</span><span class="sep"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg></span><span>Paquetes</span></nav><div class="page-head"><div><h1 class="page-title">Paquetes pendientes</h1><p class="page-subtitle">Clasificá, pesá y etiquetá los paquetes recibidos hoy.</p></div><div class="page-actions"><span class="btn btn-secondary">Imprimir etiquetas</span><span class="btn btn-primary"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>Registrar paquete</span></div></div><div class="stack"><div class="state-banner is-error" role="alert"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></span><div><div class="state-title">No se pudieron cargar los paquetes</div><div>Reintentá en unos segundos.</div></div></div></div></main></div>
</body>
</html>
