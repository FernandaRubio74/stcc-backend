services:
  db:
    image: postgres:16-alpine
    container_name: stcc_backend_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ideator
      POSTGRES_PASSWORD: ideator
      POSTGRES_DB: ideator_db
    ports:
      - "5433:5432"
    volumes:
      - stcc_backend_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideator -d ideator_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stcc_backend_pg_data:
