name: CI Backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ideator
          POSTGRES_PASSWORD: ideator
          POSTGRES_DB: ideator_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideator -d ideator_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: ideator
      PGPASSWORD: ideator
      PGDATABASE: ideator_test_db
      DATABASE_URL: postgresql://ideator:ideator@localhost:5432/ideator_test_db?schema=public
      JWT_SECRET: test_secret_solo_para_ci_no_usar_en_produccion
      JWT_EXPIRES_IN: 1d
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate

      - name: Run migrations
        run: npm run migrate

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

